[project]
name = "swarmlab"
version = "0.0.1"
description = "A scientific testbed for collaboration primitives in heterogeneous LLM-agent swarms"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyarrow>=16",
  "jinja2>=3.1",
  "pyyaml>=6",
  "typer>=0.12",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
hub = ["datasets>=3", "huggingface_hub>=0.25"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
swarmlab = "swarmlab.cli:app"

[project.entry-points."swarmlab.worlds"]
flaggame = "swarmlab.world.flaggame:FlagGame"
coloring = "swarmlab.world.coloring:ColoringGrid"
hidden_sites = "swarmlab.world.hidden_sites:HiddenSites"

[project.entry-points."swarmlab.claim_policies"]
advisory = "swarmlab.medium.registry:Advisory"
enforced = "swarmlab.medium.registry:Enforced"

[project.entry-points."swarmlab.topologies"]
broadcast = "swarmlab.medium.topology:Broadcast"
gossip = "swarmlab.medium.topology:Gossip"
groups = "swarmlab.medium.topology:Groups"
star = "swarmlab.medium.topology:Star"
tree = "swarmlab.medium.topology:Tree"

[project.entry-points."swarmlab.policies"]
delay = "swarmlab.medium.board:DelayPolicy"

[project.entry-points."swarmlab.participants"]
silent = "swarmlab.participants.scripted:Silent"
evidence_aggregator = "swarmlab.participants.scripted:EvidenceAggregator"
enumerator = "swarmlab.participants.scripted:Enumerator"
row_major_painter = "swarmlab.participants.scripted:RowMajorPainter"
queue_painter = "swarmlab.participants.scripted:QueuePainter"
random_painter = "swarmlab.participants.scripted:RandomPainter"
llm = "swarmlab.participants.llm:LLMAgent"

[project.entry-points."swarmlab.metrics"]
"belief.accuracy" = "swarmlab.metrics.belief:Accuracy"
"belief.consensus" = "swarmlab.metrics.belief:Consensus"
"belief.polarization" = "swarmlab.metrics.belief:Polarization"
"belief.entropy" = "swarmlab.metrics.belief:Entropy"
"belief.state" = "swarmlab.metrics.belief:State"
"comm.read_rate" = "swarmlab.metrics.comm:ReadRate"
"comm.posts_per_round" = "swarmlab.metrics.comm:PostsPerRound"
"comm.post_rate" = "swarmlab.metrics.comm:PostRate"
"comm.posts_total" = "swarmlab.metrics.comm:PostsTotal"
"comm.hops" = "swarmlab.metrics.comm:Hops"
"coloring.coverage" = "swarmlab.metrics.coloring:Coverage"
"coloring.duplicate_paints" = "swarmlab.metrics.coloring:DuplicatePaints"
"coloring.wrong_paints" = "swarmlab.metrics.coloring:WrongPaints"
"coloring.parallel_efficiency" = "swarmlab.metrics.coloring:ParallelEfficiency"
"claims.violations" = "swarmlab.metrics.coloring:ClaimViolations"
"claims.held" = "swarmlab.metrics.coloring:ClaimsHeld"
"hidden.expected_W" = "swarmlab.world.hidden_sites:ExpectedW"
"hidden.expected_cum" = "swarmlab.world.hidden_sites:ExpectedCum"
"hidden.actual_points" = "swarmlab.world.hidden_sites:ActualPoints"
"hidden.actual_cum" = "swarmlab.world.hidden_sites:ActualCum"

[project.entry-points."swarmlab.schedulers"]
seeded_shuffle = "swarmlab.scheduler:SeededShuffle"
one_speaker = "swarmlab.scheduler:OneSpeaker"

[project.entry-points."swarmlab.probes"]
belief = "swarmlab.probes:BeliefProbe"

[project.entry-points."swarmlab.interventions"]
inject_post = "swarmlab.interventions:InjectPost"
delay_delivery = "swarmlab.interventions:DelayDelivery"
mute = "swarmlab.interventions:Mute"
kill_agents = "swarmlab.interventions:KillAgents"
patch_private = "swarmlab.interventions:PatchPrivate"
reconfigure = "swarmlab.interventions:Reconfigure"

[project.entry-points."swarmlab.providers"]
anthropic = "swarmlab.providers.anthropic:AnthropicProvider"
openai_compat = "swarmlab.providers.openai_compat:OpenAICompatProvider"
fake = "swarmlab.providers.fake:FakeProvider"

[project.entry-points."swarmlab.fake_scripts"]
flaggame_reader = "swarmlab.providers.fake:flaggame_reader"
painter = "swarmlab.world.coloring:fake_painter"
hidden_chooser = "swarmlab.world.hidden_sites:fake_chooser"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarmlab"]
artifacts = ["swarmlab/participants/prompts/*.j2", "swarmlab/viewer/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
