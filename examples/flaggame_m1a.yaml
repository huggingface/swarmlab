# DESIGN.md example 1 as YAML: 16 scripted evidence aggregators on the Flag Game,
# comparing a broadcast board with a gossip board.
#   swarmlab validate examples/flaggame_m1a.yaml
#   swarmlab run examples/flaggame_m1a.yaml --arm gossip --seed 3
name: flaggame-m1a
budget: {soft_usd: 0, hard_usd: 0}   # scripted agents spend nothing
options:
  max_rounds: 20
arms:
  broadcast:
    world: {type: flaggame, params: {n_candidates: 8}}
    participants:
      - {type: evidence_aggregator, count: 16}
    medium: {topology: broadcast}
    metrics: [belief.consensus, belief.accuracy, belief.entropy, comm.read_rate, comm.hops]
  gossip:
    world: {type: flaggame, params: {n_candidates: 8}}
    participants:
      - {type: evidence_aggregator, count: 16}
    medium: {topology: gossip}
    metrics: [belief.consensus, belief.accuracy, belief.entropy, comm.read_rate, comm.hops]
